<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline Hybrid Attendance</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
  <div class="bg-orb orb-one"></div>
  <div class="bg-orb orb-two"></div>

  <div class="app-shell">
    <header class="hero card">
      <div>
        <p class="eyebrow">Capstone Demo Ready</p>
        <h1>Offline Hybrid Attendance System</h1>
        <p class="hero-subtitle">QR + Face Detection + Liveness Motion Check (Fully Offline)</p>
      </div>
      <div class="hero-pill">No Cloud · No Biometrics Stored</div>
    </header>

    <main class="grid-layout">
      <section class="card">
        <div class="card-title-row">
          <h2>Student Onboarding</h2>
          <span class="dot green"></span>
        </div>
        <form id="studentForm">
          <input id="studentId" type="text" placeholder="Student ID" required />
          <input id="studentName" type="text" placeholder="Student Name" required />
          <button type="submit">Generate QR</button>
        </form>
        <p id="registrationMessage" class="message"></p>
      </section>

      <section class="card scanner-card">
        <div class="card-title-row">
          <h2>Live Attendance Scanner</h2>
          <span class="dot pulse"></span>
        </div>

        <div class="video-wrap">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="overlay"></canvas>
          <div class="scan-hud">LIVE</div>
        </div>

        <div class="actions">
          <button id="startCameraBtn">Start Camera</button>
          <button id="stopCameraBtn" class="secondary">Stop Camera</button>
          <button id="markAttendanceBtn" class="success">Mark Attendance</button>
        </div>

        <div class="status-grid">
          <span id="qrStatus" class="badge idle">QR: Waiting</span>
          <span id="faceStatus" class="badge idle">Face: Waiting</span>
          <span id="attendanceStatus" class="badge idle">Attendance: Pending</span>
        </div>

        <p id="systemMessage" class="message"></p>
      </section>

      <section class="card full-width">
        <div class="card-title-row">
          <h2>Attendance Activity</h2>
          <button id="refreshAttendanceBtn" class="secondary">Refresh</button>
        </div>

        <div class="table-wrap">
          <table id="attendanceTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
